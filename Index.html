function syncServerClock(utc){const ts=Date.parse(utc);if(Number.isFinite(ts))serverClockOffset=ts-Date.now();}
function elapsedLabel(utc){const start=Date.parse(utc);if(!Number.isFinite(start))return '—';const mins=Math.floor(Math.max(0,Date.now()+serverClockOffset-start)/60000);return Math.floor(mins/60)+'h '+String(mins%60).padStart(2,'0')+'m';}
function appendDuration(parent,key,utc){if(!utc)return;const el=document.createElement('small');el.className='live-duration';el.dataset.since=utc;el.dataset.durationKey=key;el.textContent=t(key)+': '+elapsedLabel(utc);parent.append(el);}
function updateDurationLabels(){for(const el of document.querySelectorAll('[data-since]'))el.textContent=(el.dataset.durationKey?t(el.dataset.durationKey)+': ':'')+elapsedLabel(el.dataset.since);}
function durationTick(){updateDurationLabels();setTimeout(durationTick,30000);}
setTimeout(durationTick,30000);
function renderPatio(){const root=$('patioList');if(!root)return;root.replaceChildren();$('addPatio').hidden=!painel.podeAutorizar;$('addPatio').setAttribute('aria-label',t('patioAdd'));$('refreshTrailers').setAttribute('aria-label',t('refreshTrailers'));for(const x of painel.patio||[]){const row=document.createElement('div');row.className='patio-row';const plate=document.createElement('strong');plate.textContent=x.placa;const time=document.createElement('small');time.dataset.since=x.entradaUTC;time.textContent=elapsedLabel(x.entradaUTC);row.append(plate,time);root.append(row);}if(!root.children.length){const p=document.createElement('p');p.className='muted';p.textContent=t(panelReady?'patioEmpty':'loadingRecords');root.append(p);}}
$('refreshTrailers').onclick=()=>{if(busy)return;if($('movementDialog').open&&movement?.acao==='SAIDA')refreshTrailerChoices();else refreshPanel(true);};
$('addPatio').onclick=()=>{if(busy||!painel.podeAutorizar)return;if(!patioRequest||patioRequest.unidade!==unit||!patioRequest.data)patioRequest={key:newKey(),unidade:unit};$('patioForm').reset();$('patioPlate').value=patioRequest.data?.placa||'';$('patioReason').value=patioRequest.data?.motivo||'';$('patioError').textContent='';showDialog('patioDialog');};
$('cancelPatio').onclick=()=>{if(!busy)closeDialog('patioDialog');};
$('patioDialog').addEventListener('cancel',e=>{if(busy)e.preventDefault();});
$('patioPlate').oninput=()=>validatePlateField($('patioPlate'),true);
$('patioForm').onsubmit=e=>{e.preventDefault();if(busy||!patioRequest||patioRequest.unidade!==unit)return;if(!validatePlateField($('patioPlate'),true)||!$('patioForm').reportValidity())return;const data={unidade:unit,solicitacao:patioRequest.key,placa:value('patioPlate'),motivo:value('patioReason')};if(!data.motivo){$('patioReason').setCustomValidity(t('patioReasonRequired'));$('patioReason').reportValidity();return;}if(patioRequest.data&&JSON.stringify(patioRequest.data)!==JSON.stringify(data)){// Um envio com resultado incerto deve ser repetido com a mesma identidade.
 $('patioError').textContent=t('patioRetrySame');return;}patioRequest.data=data;const current=patioRequest;rpc('adicionarCarretaPatioBackend',[data],r=>{if(current!==patioRequest)return;viewRevision++;painel.patio=r.patio;syncServerClock(r.servidorUTC);cachePanel();renderPatio();patioRequest=null;closeDialog('patioDialog');message('done','',true);},{onError:code=>{if(['invalid','PLATE_ERROR','ACCESS','trailerError','CONFLICT','PREPARE','CONFIG','SESSION_EXPIRED'].includes(code)){delete current.data;current.key=newKey();}$('patioError').textContent=t(code);}});};
$('patioReason').oninput=()=>$('patioReason').setCustomValidity('');

load();
</script></body></html>
