function requiredGroups(form){const map=new Map();for(const el of Array.from(form.elements||[])){if(!el.required||el.disabled)continue;const key=el.type==='radio'?el.name:el.id;const group=map.get(key)||[];group.push(el);map.set(key,group);}return [...map.values()];}
function updateFormProgress(){for(const [id,target] of [['arrivalForm','arrivalProgress'],['movementForm','movementProgress']]){const form=$(id),out=$(target);if(!form||!out)continue;const groups=requiredGroups(form),done=groups.filter(g=>g.every(el=>el.validity.valid)).length;out.textContent=done+' / '+groups.length+' '+t('requiredComplete');out.classList.toggle('complete',groups.length>0&&done===groups.length);}}
function validateVisibleForm(form,code){form.querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));const bad=Array.from(form.elements||[]).filter(el=>el.willValidate&&!el.validity.valid);if(form.checkValidity())return true;const labels=[];for(const el of bad){el.setAttribute('aria-invalid','true');const wrap=el.closest('.field,.check-row,.check');wrap?.classList.add('invalid');const label=wrap?.querySelector('legend,label')?.textContent||el.name||el.id;if(!labels.includes(label))labels.push(label);}message(code,labels.length?t('missingFields')+': '+labels.join(', '):'');bad[0]?.focus();bad[0]?.scrollIntoView({block:'center',behavior:'smooth'});form.reportValidity();return false;}
$('pendingToggle').onclick=()=>{renderPending();showDialog('pendingDialog');};
$('closePending').onclick=()=>closeDialog('pendingDialog');
$('themeToggle').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
for(const id of ['arrivalForm','movementForm'])for(const event of ['input','change'])$(id).addEventListener(event,e=>{if(e.target.validity?.valid){e.target.removeAttribute('aria-invalid');if(e.target.type==='radio')for(const el of Array.from($(id).elements||[])){if(el.name===e.target.name)el.removeAttribute('aria-invalid');}e.target.closest('.field,.check-row,.check')?.classList.remove('invalid');}updateFormProgress();});
try{setTheme(localStorage.getItem('logistica-theme')==='dark'?'dark':'light');}catch{setTheme('light');}

let docLookupEpoch=0,docLookupTimer=null,docLookupKey='',driverAuto=null;
function setupExtraPlate(){const button=actionButton('addPlate',addExtraPlate);button.id='addPlate';button.className='secondary';button.textContent='+';button.setAttribute('aria-label',t('addPlate'));button.title=t('addPlate');$('field-placa2').append(button);}
function addExtraPlate(){if($('placa3'))return;field('placa3',{max:12});const remove=actionButton('removePlate',()=>{$('field-placa3').remove();$('addPlate').hidden=false;updateFormProgress();});remove.className='secondary remove-extra-plate';$('field-placa3').append(remove);$('addPlate').hidden=true;translate();$('placa3').focus();}
function setupDriverLookup(){const input=$('documento');const hint=document.createElement('small');hint.id='driverLookupStatus';hint.setAttribute('role','status');hint.setAttribute('aria-live','polite');$('field-documento').append(hint);input.setAttribute('aria-describedby','driverLookupStatus');input.addEventListener('input',()=>{docLookupEpoch++;docLookupKey='';clearTimeout(docLookupTimer);hint.textContent='';if(driverAuto){for(const k of ['motorista','empresa'])if($(k)?.value===driverAuto[k])$(k).value='';driverAuto=null;}if(config.pais==='BR'&&input.value.replace(/\D/g,'').length===11)docLookupTimer=setTimeout(lookupDriver,400);});input.addEventListener('blur',lookupDriver);}
function lookupDriver(){const documentValue=value('documento');if(!session||!config||!documentValue)return;const doc=documentValue.replace(/[\s.\/-]/g,'').toUpperCase();if(config.pais==='BR'&&!/^\d{11}$/.test(doc))return;if(config.pais!=='BR'&&!/^[A-Z0-9]{4,24}$/.test(doc))return;const key=session.email+'|'+session.pais+'|'+unit+'|'+doc;if(docLookupKey===key)return;docLookupKey=key;const token=++docLookupEpoch,old={motorista:value('motorista'),empresa:value('empresa')},email=session.email,pais=session.pais,code=unit;const valid=()=>token===docLookupEpoch&&session?.email===email&&session?.pais===pais&&unit===code&&value('documento').replace(/[\s.\/-]/g,'').toUpperCase()===doc;const hint=$('driverLookupStatus');hint.textContent=t('driverSearching');const sent=rpc('buscarMotoristaBackend',[code,doc],r=>{if(!r){hint.textContent=t('driverNew');return;}let unavailable=false;driverAuto={};for(const k of ['motorista','empresa']){const input=$(k);if(!input||value(k)!==old[k])continue;if(k==='empresa'&&input.tagName==='SELECT'&&!Array.from(input.options).some(o=>o.value===r[k])){unavailable=true;continue;}input.value=r[k];driverAuto[k]=r[k];}hint.textContent=t(unavailable?'driverCompanyUnavailable':'driverFound');updateFormProgress();},{background:true,valid,onError:()=>{docLookupKey='';hint.textContent=t('driverLookupError');}});if(!sent){docLookupKey='';hint.textContent=t('driverLookupError');}}

function setupInvoiceSealFields(){const invoices=$('faturas'),seal=$('lacres');if(!invoices||!seal)return;const update=()=>{const present=lines('faturas').length>0;$('field-lacres').hidden=!present;setListState('lacres',$('field-lacres').dataset.repeatList?$('field-lacres').dataset.listRequired==='true':$('field-lacres').dataset.baseRequired==='true',present);if(!present)clearListField('lacres');};const watched=$('field-faturas')?.dataset.repeatList?$('field-faturas'):invoices;if(!watched.dataset.sealWatcher){watched.addEventListener('input',update);watched.addEventListener('change',update);watched.dataset.sealWatcher='true';}update();}


let exitExtras={invoice:false,seal:false};
function setupExitExtras(){const actions=document.createElement('div');actions.className='toolbar wide';actions.id='exitExtrasActions';for(const [id,key,fn] of [['addExitInvoice','addExitInvoice',()=>{exitExtras.invoice=true;updateLoadedExit();$('exitFaturas').focus();}],['addExitSeal','addExitSeal',()=>{exitExtras.seal=true;updateLoadedExit();$('exitLacres').focus();}],['removeExitInvoice','removeExitInvoice',()=>{exitExtras={invoice:false,seal:false};clearListField('exitFaturas');clearListField('exitLacres');updateLoadedExit();}],['removeExitSeal','removeExitSeal',()=>{exitExtras.seal=false;clearListField('exitLacres');updateLoadedExit();}]]){const b=actionButton(key,fn);b.id=id;b.className='secondary';actions.append(b);}$('movementFields').append(actions);($('field-exitFaturas')?.dataset.repeatList?$('field-exitFaturas'):$('exitFaturas')).addEventListener('input',updateLoadedExit);$('field-exitLacres').addEventListener('input',updateLoadedExit);}
function updateLoadedExit(){const loaded=value('carregado')==='SIM',empty=value('carregado')==='NAO',hasInvoice=lines('exitFaturas').length>0;if(empty&&!hasInvoice){exitExtras.seal=false;clearListField('exitLacres');}
 const destination=$('exitDestino');if(destination){destination.required=loaded;destination.disabled=!loaded;$('field-exitDestino').hidden=!loaded;}
 for(const [id,shown] of [['exitFaturas',loaded||(empty&&exitExtras.invoice)],['exitLacres',loaded||(empty&&exitExtras.seal&&hasInvoice)]]){const el=$(id);if(!el)continue;setListState(id,shown,shown);$('field-'+id).hidden=!shown;}
 if($('exitExtrasActions')){$('exitExtrasActions').hidden=!empty;$('addExitInvoice').hidden=exitExtras.invoice;$('addExitSeal').hidden=!exitExtras.invoice||!hasInvoice||exitExtras.seal;$('removeExitInvoice').hidden=!exitExtras.invoice;$('removeExitSeal').hidden=!exitExtras.seal;}
 for(const key of ['carga','lacres']){const radio=$('chk-'+key+'-NA');if(radio){radio.disabled=loaded;if(loaded)radio.checked=false;const label=radio.closest('.choice');if(label)label.hidden=loaded;}}
 if(movement?.acao==='SAIDA'){const show=lines('exitLacres').length>0;$('entryPhotoFields').hidden=!show;$('fotoLacre').required=false;if(!show){fotoData='';$('fotoLacre').value='';$('photoPreview').hidden=true;$('removePhoto').hidden=true;}}updateFormProgress();}

function validateArrivalData(){for(const key of ['placa1','placa2','placa3']){const el=$(key);if(!el)continue;const plate=el.value.replace(/[\s-]/g,'').toUpperCase();const valid=!plate?key!=='placa1':(config.pais==='BR'?/^[A-Z]{3}\d[A-Z]\d{2}$/:/^[A-Z0-9]{5,10}$/).test(plate);validatePlateField(el,key==='placa1');if(!valid){el.closest('.field')?.classList.add('invalid');el.setAttribute('aria-invalid','true');message('PLATE_ERROR');el.focus();el.reportValidity();return false;}el.value=plate;}if(config.pais==='BR'&&value('finalidade')==='TRANSFERENCIA'&&(!lines('faturas').length||!lines('lacres').length)){message('transferDocuments');const el=!lines('faturas').length?$('faturas'):$('lacres');el.closest('.field')?.classList.add('invalid');el.focus();el.reportValidity();return false;}return true;}

function validatePlateField(el,required){const plate=el.value.replace(/[\s-]/g,'').toUpperCase();const valid=!plate?!required:(config.pais==='BR'?/^[A-Z]{3}\d[A-Z]\d{2}$/:/^[A-Z0-9]{5,10}$/).test(plate);el.setCustomValidity(valid?'':t('PLATE_ERROR'));let hint=$('plateError-'+el.id);if(!hint){hint=document.createElement('small');hint.id='plateError-'+el.id;hint.className='field-error';el.closest('.field')?.append(hint);el.setAttribute('aria-describedby',hint.id);}hint.textContent=valid?'':t('PLATE_ERROR');hint.hidden=valid;if(!valid){el.setAttribute('aria-invalid','true');el.closest('.field')?.classList.add('invalid');}else{el.removeAttribute('aria-invalid');el.closest('.field')?.classList.remove('invalid');}return valid;}

function repeatField(key,required,target){const first=field(key,{required,max:100},target),wrap=$('field-'+key);wrap.dataset.repeatList=key;wrap.dataset.listRequired=String(required);wrap.dataset.listEnabled='true';const row=document.createElement('div');row.className='repeat-row';row.append(first);wrap.append(row);const add=actionButton(/faturas/i.test(key)?'addAnotherInvoice':'addAnotherSeal',()=>addListItem(key));add.dataset.t=/faturas/i.test(key)?'addAnotherInvoice':'addAnotherSeal';add.id='add-item-'+key;add.className='secondary add-list-item';wrap.append(add);first.autocomplete='off';return first;}
function addListItem(key,content='',focus=true){const wrap=$('field-'+key);if(!wrap?.dataset.repeatList)return;const inputs=Array.from(wrap.querySelectorAll('input'));if(inputs.length>=100){message('listLimit');return;}const row=document.createElement('div');row.className='repeat-row extra-list-row';const input=document.createElement('input');input.type='text';input.maxLength=100;input.id=key+'-item-'+newKey();input.dataset.extraListItem='true';input.value=content;input.required=wrap.dataset.listEnabled!=='false';input.disabled=wrap.dataset.listEnabled==='false';input.setAttribute('aria-label',t(/faturas/i.test(key)?'faturas':'lacres')+' '+(inputs.length+1));const remove=actionButton('removeListItem',()=>{row.remove();notifyListChanged(key);});remove.dataset.t='removeListItem';remove.className='secondary remove-list-item';row.append(input,remove);wrap.insertBefore(row,$('add-item-'+key));notifyListChanged(key);if(focus)input.focus();return input;}
function clearListField(key){const el=$(key);if(!el)return;const wrap=$('field-'+key);if(wrap?.dataset.repeatList){Array.from(wrap.querySelectorAll('input')).filter(x=>x.dataset.extraListItem).forEach(x=>x.parentElement.remove());}el.value='';}
function restoreListField(key,values){clearListField(key);$(key).value=values[0]||'';values.slice(1).forEach(v=>addListItem(key,v,false));}
function setListState(key,required,enabled=true){const el=$(key);if(!el)return;const wrap=$('field-'+key);if(wrap?.dataset.repeatList){wrap.dataset.listRequired=String(required);wrap.dataset.listEnabled=String(enabled);Array.from(wrap.querySelectorAll('input')).forEach(input=>{input.required=enabled&&(required||!!input.dataset.extraListItem);input.disabled=!enabled;input.setAttribute('aria-required',String(input.required));});const add=$('add-item-'+key);if(add)add.disabled=!enabled;}else{el.required=required&&enabled;el.disabled=!enabled;el.setAttribute('aria-required',String(el.required));}const marker=$('required-'+key);if(marker)marker.hidden=!(required&&enabled);}
function notifyListChanged(key){if(key==='faturas')setupInvoiceSealFields();if(['exitFaturas','exitLacres'].includes(key))updateLoadedExit();updateFormProgress();}

function setupTrailerSwap(v){field('trocarCarretas',{required:true,options:[{value:'NAO',key:'NAO'},{value:'SIM',key:'SIM'}],wide:true},'movementFields');$('trocarCarretas').value='NAO';for(const id of ['saidaCarreta1','saidaCarreta2']){field(id,{options:[]},'movementFields');$('field-'+id).hidden=true;$(id).disabled=true;}const update=actionButton('refreshTrailers',refreshTrailerChoices);update.id='refreshTrailers';update.className='secondary';update.hidden=true;$('movementFields').append(update);$('trocarCarretas').onchange=()=>{const change=value('trocarCarretas')==='SIM';for(const id of ['saidaCarreta1','saidaCarreta2']){$('field-'+id).hidden=!change;$(id).disabled=!change;}$('refreshTrailers').hidden=!change;if(change)refreshTrailerChoices();};}
function refreshTrailerChoices(){if(!movement||value('trocarCarretas')!=='SIM')return;const current=movement,code=unit,owner=session.email;current.patioPronto=false;message('patioWait');rpc('listarCarretasPatioBackend',[code],rows=>{for(const id of ['saidaCarreta1','saidaCarreta2']){const old=value(id);$(id).replaceChildren(opt('','noTrailer'));rows.forEach(x=>{const o=document.createElement('option');o.value=x.placa;o.textContent=x.placa;$(id).append(o);});$(id).value=rows.some(x=>x.placa===old)?old:'';}current.patioPronto=true;$('movementError').hidden=true;message('');},{background:true,valid:()=>movement===current&&unit===code&&session?.email===owner,onError:()=>message('trailerError')});}
async function cancelFailedRequest(job){if(!queueScope(job))return;try{await writeQueue.cancel(job.key,j=>new Promise((resolve,reject)=>{rpc('cancelarSolicitacaoBackend',[{tipo:j.tipo,unidade:j.dados.unidade,solicitacao:j.key}],resolve,{background:true,onError:code=>reject(Error(code))})||reject(Error('SESSION_EXPIRED'));}));viewRevision++;renderPanel();message('requestCancelled','',true);}catch(e){message(e.message==='CANCELAMENTO_GRAVADO'?'cancelRecorded':errorCode(e));}}

load();
</script></body></html>
